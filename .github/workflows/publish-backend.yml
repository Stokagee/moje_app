name: Publish backend image

on:
  push:
    branches: [main]
    paths:
      - "be/**"
      - ".github/workflows/publish-backend.yml"
  workflow_dispatch:

jobs:
  publish:
    name: Build & push backend image to ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set lowercase owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./be
          file: ./be/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/moje-app-backend:latest
            ghcr.io/${{ steps.owner.outputs.value }}/moje-app-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
