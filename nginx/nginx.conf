# Nginx Reverse Proxy s mTLS (mutual TLS) konfigurací
#
# Tato konfigurace poskytuje:
# 1. HTTPS termination (TLS)
# 2. mTLS - klient musí předložit certifikát
# 3. Reverse proxy na FastAPI backend
# 4. CORS headers
# 5. Rate limiting (volitelné)

events {
    worker_connections 1024;
}

http {
    # Logging konfigurace
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'ssl_client_verify=$ssl_client_verify '
                    'ssl_client_dn=$ssl_client_s_dn';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Upstream - FastAPI backend
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # Rate limiting zone (ochrana proti DDoS)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ============================================================================
    # HTTPS Server s mTLS
    # ============================================================================
    server {
        listen 443 ssl;
        server_name localhost;

        # TLS certifikáty (server)
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # TLS nastavení
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ================================================================
        # mTLS (Mutual TLS) - Klientský certifikát
        # ================================================================
        #
        # Jak to funguje:
        # 1. Klient se připojí k serveru
        # 2. Server předloží svůj certifikát (TLS handshake)
        # 3. Server POŽADUJE klientský certifikát
        # 4. Klient předloží svůj certifikát
        # 5. Nginx ověří certifikát proti CA
        # 6. Pokud je validní, request pokračuje na backend
        #
        ssl_client_certificate /etc/nginx/certs/ca.crt;
        ssl_verify_client on;  # Vyžadovat klientský certifikát
        ssl_verify_depth 2;    # Hloubka ověření certifikační cesty

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ================================================================
        # API Proxy
        # ================================================================
        location /api/ {
            # Rate limiting (10 requestů/s)
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;

            # Proxy na backend
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # mTLS headers - předání informací o certifikátu backendu
            #
            # Backend může ověřit:
            # X-Client-Verified: SUCCESS (nebo FAILED)
            # X-Client-CN: CN z certifikátu (např. "frontend-client")
            #
            proxy_set_header X-Client-Verified $ssl_client_verify;
            proxy_set_header X-Client-CN $ssl_client_s_dn;
            proxy_set_header X-Client-Fingerprint $ssl_client_fingerprint;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Keep-alive
            proxy_set_header Connection "";
        }

        # Health check endpoint (bez mTLS)
        location /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Docs endpoint (bez rate limitu)
        location /docs {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Root
        location / {
            return 200 '{"message": "Food Delivery API", "docs": "/docs"}';
            add_header Content-Type application/json;
        }
    }

    # ============================================================================
    # HTTP -> HTTPS redirect (volitelné)
    # ============================================================================
    server {
        listen 80;
        server_name localhost;

        location / {
            return 301 https://$host$request_uri;
        }
    }
}
